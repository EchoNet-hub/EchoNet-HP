
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="西谷響の外部リンク">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_links.css">
    <title>リンク・Links | 西谷響</title>
</head>

<body>

    <main class="links-page">

        <div class="language-switch" aria-label="言語切り替え">

            <a
                class="language-link current-language"
                href="./"
                lang="ja"
                aria-current="page"
            >
                日本語
            </a>

            <span class="language-divider" aria-hidden="true">｜</span>

            <a
                class="language-link"
                href="../English/"
                lang="en"
            >
                English
            </a>

        </div>

        <header class="site-header">
            <a class="site-title" href="../">
                西谷響（Hibiki Nishitani）のホームページ
            </a>
        </header>

        <nav class="main-nav" aria-label="メインメニュー">

            <div class="nav-item">
                <a class="nav-link" href="../About_Jap/">
                    略歴
                </a>
            </div>

            <div class="nav-item">
                <a class="nav-link" href="../Research_Jap/">
                    研究
                </a>
            </div>

            <div class="nav-item">
                <a class="nav-link" href="../Works_Jap/">
                    業績
                </a>
            </div>

            <div class="nav-item">
                <a class="nav-link" href="../Sources_Jap/">
                    資料
                </a>
            </div>

            <div class="nav-item">
                <a
                    class="nav-link current-page"
                    href="./"
                    aria-current="page"
                >
                    リンク
                </a>
            </div>

        </nav>

        <section class="hero">

            <img
                class="hero-image"
                src="IMG_1903_trim.JPG"
                alt=""
            >

            <div class="hero-overlay">
                <h1 class="hero-title">
                    <span>リンク</span>
                </h1>
            </div>

        </section>

        <section class="links-list" aria-label="外部リンク">

            <a
                class="link-item"
                href="https://github.com/EchoNet-hub"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHubを開く"
            >
                <div class="logo-box">
                    <img
                        class="link-logo"
                        src="GitHub_Invertocat_White.png"
                        alt="GitHub"
                    >
                </div>

                <span class="link-name">GitHub</span>
            </a>

            <a
                class="link-item"
                href="https://x.com/nhwin11"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Xを開く"
            >
                <div class="logo-box">
                    <img
                        class="link-logo"
                        src="logo-white.png"
                        alt="X"
                    >
                </div>

                <span class="link-name">X</span>
            </a>

            <a
                class="link-item"
                href="https://researchmap.jp/nishitani_hibiki"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Researchmapを開く"
            >
                <div class="logo-box">
                    <img
                        class="researchmap-logo"
                        src="https://researchmap.jp/outline/img/researchmap130.gif"
                        alt="Researchmap"
                    >
                </div>

                <span class="link-name">Researchmap</span>
            </a>

        </section>

        <footer class="site-footer">

            <p class="copyright">
                copyright (c) 2024 Nishitani Hibiki
            </p>

            <a class="contact-link" href="../Contact_Jap/">
                コンタクト・Contact
            </a>

        </footer>

    </main>

</body>

</html>
